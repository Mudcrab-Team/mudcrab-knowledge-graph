[workspace]
resolver = "2"
members = ["crates/knowledge-graph"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled-full"] }
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "sync"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
